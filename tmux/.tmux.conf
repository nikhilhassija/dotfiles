# ======================
# Key bindings
# ======================

# Remap prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and -
unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Switch panes using Alt + Arrow without prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Remove confirmations
bind & kill-window
bind x kill-pane

# Toggle synchronize panes
bind C-e setw synchronize-panes

# ======================
# Terminal
# ======================

set -g default-terminal "tmux-256color"

# Enable true color
set -as terminal-features ",*:RGB"

# Mouse is handled by tmux-better-mouse-mode
# set -g mouse on

# ======================
# General
# ======================

set -g status-position bottom
set -g status-justify left
set -g status-interval 1

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g xterm-keys on
setw -g clock-mode-colour colour135

# ======================
# Styling
# ======================

# Pane borders
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236

# Copy mode
setw -g mode-style fg=colour196,bg=colour238,bold

# Messages
set -g message-style fg=colour232,bg=colour166,bold
set -g message-command-style fg=blue,bg=black

# Status bar
set -g status-style fg=colour137,bg=colour234

set -g status-left ''
set -g status-left-length 20

set -g status-right '#{prefix_highlight}#[fg=colour231,bg=colour04]#{?pane_synchronized, SYNCED ,}#[fg=colour233,bg=colour241,bold] %d/%m/%y #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Windows
setw -g window-status-style fg=colour138,bg=colour235

setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-current-style fg=colour81,bg=colour238,bold

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-bell-style fg=colour255,bg=colour1,bold

# ======================
# Plugins
# ======================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

set -g @continuum-boot 'on'

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'
